# Switched off: autobump runs on GitHub (.github/workflows/autobump.yml).
name: autobump

on:
  workflow_dispatch:

jobs:
  autobump:
    runs-on: codeberg-medium
    container:
      image: docker.io/gentoo/stage3:latest
    env:
      FEATURES: "getbinpkg -sandbox -usersandbox -ipc-sandbox -network-sandbox -pid-sandbox -mount-sandbox"
      AUTOBUMP_TOKEN: ${{ secrets.AUTOBUMP_TOKEN }}
    steps:
      - name: Install the tooling
        run: |
          emerge-webrsync -q
          emerge --quiet --noreplace --getbinpkg dev-vcs/git dev-util/pkgcheck \
            app-portage/pycargoebuild dev-lang/rust-bin

      - name: Check out main
        run: |
          git clone -q --branch main \
            "https://autobump:${AUTOBUMP_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" overlay

      - name: Bump the packages
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          cd overlay
          git config user.name "FreedomNAS CI"
          git config user.email "ci@freedomnas.invalid"
          mkdir -p /var/cache/distfiles
          python3 -I .github/autobump/autobump.py --push --distdir /var/cache/distfiles $PACKAGES
